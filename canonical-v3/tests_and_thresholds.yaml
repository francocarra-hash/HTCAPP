  - test_id: "RHR_001"
    key: "RHR"
    name: "Resting Heart Rate"
    domain: "AEROBIC"
    unit: "beats_per_minute"
    weight: 1          # MVP: RHR solo. En v2.0 pasa a 2 (con VO2 en 1).
    weight_v2: 2
    is_inverse: true
    required_in_mvp: true
    source: "Authoritative v1.0 §3.4"
    populations:
      # ── v1.2 PROPUESTA (2026-08-02) — pendiente de aprobación clínica ──────
      # NHANES 1999-2008 (CDC, n=35.302 sin medicación ni condición que altere
      # el pulso, medido tras ~4 min sentado — mismo protocolo que HTC) reporta
      # para adultos 20-39: media 71 bpm, P5 52, P95 89.
      # El umbral crítico vigente de 30-50 (90 bpm) coincide con ese P95, y la
      # encuesta NO separa 20-29 de 30-39: no hay evidencia de una diferencia
      # clínicamente relevante. Por eso se extiende la misma banda hacia abajo
      # en lugar de inventar valores nuevos.
      - id: "AGE_18_30"
        sex: null
        age_min: 18
        age_max: 30
        umbral_critical: 90
        umbral_emerging: 75
        umbral_functional: 60
        umbral_foundation: 60
        approval_status: "PROPOSED"
        source: "Ostchega Y, et al. Resting pulse rate reference data for children, adolescents, and adults: United States, 1999-2008. National Health Statistics Reports No. 41. CDC/NCHS, 2011."
        evidence: "NHANES 20-39 años: media 71 bpm, P5 52, P95 89. El corte crítico vigente (90) ≈ P95."
        rationale: "Misma banda que 30-50: NHANES agrupa 20-39 y no evidencia diferencia relevante. Alternativa conservadora a crear umbrales sin respaldo."

      - id: "AGE_30_50"
