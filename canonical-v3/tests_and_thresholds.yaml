# tests_and_thresholds.yaml
# Transcripción literal de HTC_YAML_SCHEMA_UPDATED_POST_C5_v1.0.md — FILE 3,
# contrastada con HTC_THRESHOLDS_CANONICAL_v1.0.md (misma tabla, C-5 resuelto).
version: "1.0"
last_updated: "2026-07-25"
effective_date: "2026-07-25"
source_document: "HTC_THRESHOLDS_CANONICAL_v1.0 + YAML SCHEMA POST-C5 FILE 3"
canonical: true

metadata:
  description: "Single canonical table of all numeric thresholds"
  rationale: "C-5: Resolved all threshold conflicts into unified table"

# ── Fórmula de clasificación (C-2) ──────────────────────────────────────────
# Score_0_3 = ((value - umbral_critical) / (umbral_foundation - umbral_critical)) × 3
# Clamped a [0.0, 3.0]. Vale igual para tests inversos: usando los valores
# numéricos de los umbrales, la fórmula del schema
#   ((umbral_critical - value) / (umbral_critical - umbral_foundation)) × 3
# es algebraicamente idéntica (verificado con RHR 75 → 1.5).
scoring:
  formula: "((value - umbral_critical) / (umbral_foundation - umbral_critical)) * 3"
  clamp: [0.0, 3.0]
  note: |
    Sólo umbral_critical y umbral_foundation entran en la fórmula.
    umbral_emerging y umbral_functional se conservan como referencia clínica
    declarada por HTC; ver OBSERVACION_OBS-1 en OBSERVACIONES_PAQUETE_C5.md
    (en tests donde umbral_functional == umbral_foundation la interpolación
    clasifica FOUNDATION en parte del rango que la tabla rotula FUNCTIONAL).
  verification_status: "VERIFIED"

tests:
  # ══════════════════ STRENGTH (6 tests, peso total 11.5) ══════════════════
  - test_id: "GRIP_001"
    key: "HANDGRIP"
    name: "Handgrip Strength"
    domain: "STRENGTH"
    unit: "kilograms"
    weight: 3
    is_inverse: false
    source: "Authoritative v1.0 §3.2 — iGRIPS 2024, N=2.4M"
    populations:
      # ── v1.2 PROPUESTA — 18-20 años ───────────────────────────────────────
      # La fuerza de agarre sigue creciendo hasta los 25-35 años; entre 19 y 20
      # la diferencia no es clínicamente relevante. Se extiende la banda 20-30
      # sin crear valores nuevos (opción conservadora).
      # NO se cubren menores de 18: evaluar menores implica consentimiento
      # parental y curvas de crecimiento; requiere decisión explícita de HTC.
      - id: "MALE_18_20"
        sex: "MALE"
        age_min: 18
        age_max: 20
        umbral_critical: 30
        umbral_emerging: 38
        umbral_functional: 48
        umbral_foundation: 57
        approval_status: "PROPOSED"
        source: "Wang YC, et al. Hand-Grip Strength: Normative Reference Values and Equations for Individuals 18 to 85 Years of Age Residing in the United States. JOSPT 2018;48(9):685-693."
        evidence: "El pico de fuerza se alcanza a los 25-35 años; 18-19 está en la misma fase ascendente que 20-24."
        rationale: "Se extiende la banda 20-30 en lugar de derivar umbrales propios."

      - id: "FEMALE_18_20"
        sex: "FEMALE"
        age_min: 18
        age_max: 20
        umbral_critical: 20
        umbral_emerging: 24
        umbral_functional: 30
        umbral_foundation: 36
        approval_status: "PROPOSED"
        source: "Wang YC, et al. JOSPT 2018;48(9):685-693."
        evidence: "Ídem, banda femenina 20-30."
        rationale: "Se extiende la banda 20-30 en lugar de derivar umbrales propios."

      - id: "MALE_20_30"
        sex: "MALE"
        age_min: 20
        age_max: 30
        umbral_critical: 30
        umbral_emerging: 38
        umbral_functional: 48
        umbral_foundation: 57
        approval_status: "APPROVED"
      - id: "MALE_30_50"
        sex: "MALE"
        age_min: 30
        age_max: 50
        umbral_critical: 30
        umbral_emerging: 40
        umbral_functional: 50
        umbral_foundation: 60
      - id: "FEMALE_20_30"
        sex: "FEMALE"
        age_min: 20
        age_max: 30
        umbral_critical: 20
        umbral_emerging: 24
        umbral_functional: 30
        umbral_foundation: 36
      - id: "FEMALE_30_50"
        sex: "FEMALE"
        age_min: 30
        age_max: 50
        umbral_critical: 18
        umbral_emerging: 22
        umbral_functional: 28
        umbral_foundation: 34
      # ── v1.1 (2026-08-02) — HANDGRIP_THRESHOLDS_AGE_50PLUS_v1.0 ────────────
      # Opción A (dos bandas) aprobada por Magnetia. Extrapolación por declive
      # etario: ~5% de 30-50 a 50-60; ~10% adicional después de 60.
      - id: "MALE_50_60"
        sex: "MALE"
        age_min: 50
        age_max: 60
        umbral_critical: 28
        umbral_emerging: 38
        umbral_functional: 47
        umbral_foundation: 57
        source: "Age-extrapolated (HANDGRIP_THRESHOLDS_AGE_50PLUS_v1.0) — Bohannon, Inouye, Sañudo"
      - id: "MALE_60_PLUS"
        sex: "MALE"
        age_min: 60
        age_max: null
        umbral_critical: 25
        umbral_emerging: 34
        umbral_functional: 42
        umbral_foundation: 51
        source: "Age-extrapolated (HANDGRIP_THRESHOLDS_AGE_50PLUS_v1.0) — declive acelerado post-60"
      - id: "FEMALE_50_60"
        sex: "FEMALE"
        age_min: 50
        age_max: 60
        umbral_critical: 17
        umbral_emerging: 21
        umbral_functional: 26
        umbral_foundation: 32
        source: "Age-extrapolated (HANDGRIP_THRESHOLDS_AGE_50PLUS_v1.0)"
      - id: "FEMALE_60_PLUS"
        sex: "FEMALE"
        age_min: 60
        age_max: null
        umbral_critical: 15
        umbral_emerging: 19
        umbral_functional: 23
        umbral_foundation: 29
        source: "Age-extrapolated (HANDGRIP_THRESHOLDS_AGE_50PLUS_v1.0) — declive acelerado post-60"

  - test_id: "5xSTS_001"
    key: "SIT_TO_STAND_5X"
    name: "5x Sit-to-Stand (Timed)"
    domain: "STRENGTH"
    unit: "seconds"
    weight: 2
    is_inverse: true
    source: "Authoritative v1.0 §3.3"
    populations:
      # 18-19 va en banda propia para no marcar como provisional a los adultos
      # de 20-65, cuya banda ya está aprobada. Mismos umbrales.
      - id: "GENERAL_18_20"
        sex: null
        age_min: 18
        age_max: 20
        umbral_critical: 24
        umbral_emerging: 18
        umbral_functional: 12
        umbral_foundation: 12
        approval_status: "PROPOSED"
        source: "Extensión del límite inferior de la banda aprobada 20-65."
        rationale: "Mismos umbrales que 20-65: no hay razón fisiológica para excluir a 18-19 ni para asignarles valores distintos."

      - id: "GENERAL_20_65"
        sex: null
        age_min: 20
        age_max: 65
        umbral_critical: 24
        umbral_emerging: 18
        umbral_functional: 12
        umbral_foundation: 12
        approval_status: "APPROVED"

      # ── v1.2 PROPUESTA — 65+ años ─────────────────────────────────────────
      # Bohannon RW (2006), meta-análisis de 14 estudios en adultos mayores:
      # rendimiento peor que el promedio a partir de 11.4 s (60-69), 12.6 s
      # (70-79) y 14.8 s (80-89). Un tiempo > 15 s se asocia a CAÍDAS
      # RECURRENTES en ≥65 años.
      # Por eso esta banda es MÁS ESTRICTA que la de adultos (crítico 20 vs 24):
      # en mayores la lentitud predice caídas, un evento clínicamente grave, y
      # con los umbrales de adulto un cliente con riesgo quedaría FUNCTIONAL.
      - id: "GENERAL_65_PLUS"
        sex: null
        age_min: 65
        age_max: null
        umbral_critical: 20
        umbral_emerging: 15
        umbral_functional: 12
        umbral_foundation: 12
        approval_status: "PROPOSED"
        source: "Bohannon RW. Reference Values for the Five-Repetition Sit-to-Stand Test: A Descriptive Meta-Analysis of Data from Elders. Percept Mot Skills 2006;103(1):215-222."
        evidence: "Norma por edad: 11.4 s (60-69), 12.6 s (70-79), 14.8 s (80-89). Corte de riesgo de caídas recurrentes: >15 s."
        rationale: "El corte de caídas (15 s) queda en el límite Functional/Emerging, de modo que un cliente en riesgo se marca como EMERGING y no como FUNCTIONAL. Verificación: 13 s → 2.63 FOUNDATION; 16 s → 1.5 EMERGING; 21 s → 0 CRITICAL."

