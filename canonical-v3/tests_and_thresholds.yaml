# ── Cobertura de poblaciones ────────────────────────────────────────────────
# RESUELTO en v1.1 (Magnetia, APPROVED): Handgrip 50-60 y 60+ (ambos sexos).
# RESUELTO en v1.2 (PROPUESTA del equipo, pendiente de aprobación clínica):
#   · RHR 18-30        → banda AGE_18_30       (NHANES 1999-2008)
#   · Handgrip 18-20   → MALE/FEMALE_18_20     (JOSPT 2018)
#   · 5xSTS 18-19      → GENERAL_18_65         (extensión del límite inferior)
#   · 5xSTS 65+        → GENERAL_65_PLUS       (Bohannon 2006, riesgo de caídas)
#
# NO cubierto deliberadamente (el motor sigue fallando fuerte):
#   · Menores de 18 años en cualquier test. Evaluar menores exige consentimiento
#     parental y curvas de crecimiento, no extrapolación de normas adultas.
#     Requiere decisión explícita de HTC sobre alcance etario de la plataforma.
#
# Toda población con approval_status: PROPOSED emite advertencia al cargar el
# canonical y se marca en la interfaz. Ver PROPUESTA_POBLACIONES_v1.2.md.
