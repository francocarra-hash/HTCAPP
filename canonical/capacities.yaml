# Source: HTC MASTER TABLES — Table 1 (Capacity Master Table) + HTC Platform
# Data §5 (Capacity Master Table, incl. subcapacities) + Operating System cap. 6-9.
# hierarchy_level 0 = Health markers layer; development proceeds 0 → 4.
# capacity_type values per Platform Data §4.5: Health / Foundation / Development /
# Integration / Expression.
# conflict_tier / impact_factor only present where OS cap.10.2-10.3 assigns one
# explicitly (General Health, Movement, Stability, Mobility, Strength-rest, Aerobic
# inherit from their domain unless overridden here).

capacities:
  # ── GENERAL HEALTH ─────────────────────────────────────────────────────────
  - id: "CAP_GENERAL_HEALTH_STATUS"
    domain_id: "DOMAIN_GENERAL_HEALTH"
    name: "General Health Status"
    hierarchy_level: 0
    capacity_type: "Health"
    parent_capacity_id: null
    required_predecessor_id: null
    description: "Gate-keeper systemic health state. Aggregates clinical intake (pain, injury, medical/surgical history, medication, red flags) and Health Markers biomarker areas (cardiovascular, metabolic, inflammatory, organ function, endocrine)."
    active: true
    verification_status: "VERIFIED"
    sources: ["HTC_Health_Markers_Standard §2, §5, §8", "HTC PLATFORM DATA §4.2"]

  # ── STRENGTH (Master Tables T1 + Platform Data §5.1) ───────────────────────
  - id: "CAP_HEALTH_STRENGTH_MARKERS"
    domain_id: "DOMAIN_STRENGTH"
    name: "Health Strength Markers"
    hierarchy_level: 0
    capacity_type: "Health"
    parent_capacity_id: null
    required_predecessor_id: null
    description: "General neuromuscular health markers (Handgrip + 30-Second Chair Stand)."
    active: true
    verification_status: "VERIFIED"
    sources: ["HTC MASTER TABLES T1", "HTC_OPERATING_SYSTEM cap.7.1"]

  - id: "CAP_STABILITY"
    domain_id: "DOMAIN_STRENGTH"
    name: "Stability"
    hierarchy_level: 1
    capacity_type: "Foundation"
    parent_capacity_id: "CAP_HEALTH_STRENGTH_MARKERS"
    required_predecessor_id: "CAP_HEALTH_STRENGTH_MARKERS"
    description: "Produce stable base for force (Front Plank, Side Plank, Biering-Sørensen, Single-Leg Isometric Squat)."
    conflict_tier: 3
    impact_factor: 2.0
    active: true
    verification_status: "VERIFIED"
    sources: ["HTC MASTER TABLES T1", "HTC_OPERATING_SYSTEM cap.10.2 (TIER 3B, ×2.0)"]

  - id: "CAP_FORCE_PRODUCTION"
    domain_id: "DOMAIN_STRENGTH"
    name: "Force Production"
    hierarchy_level: 2
    capacity_type: "Development"
    parent_capacity_id: "CAP_STABILITY"
    required_predecessor_id: "CAP_STABILITY"
    description: "Produce force across 4 spectrums (Upper Push, Upper Pull, Knee-Dominant, Hip-Dominant). CRITICAL RULE: only Force Production classification changes exercise level."
    active: true
    verification_status: "VERIFIED"
    sources: ["HTC MASTER TABLES T1", "HTC_Strength_Assessment_Standards §3"]
    subcapacities: ["Upper Push", "Upper Pull", "Knee-Dominant", "Hip-Dominant"]

  - id: "CAP_FORCE_ENDURANCE"
    domain_id: "DOMAIN_STRENGTH"
    name: "Force Endurance"
    hierarchy_level: 3
    capacity_type: "Development"
    parent_capacity_id: "CAP_FORCE_PRODUCTION"
    required_predecessor_id: "CAP_FORCE_PRODUCTION"
    description: "Sustain force without degradation (Dead Hang + endurance patterns at the same level/load as Force Production). NEVER determines exercise progression."
    active: true
    verification_status: "VERIFIED"
    sources: ["HTC MASTER TABLES T1", "HTC_Strength_Assessment_Standards §4"]
    subcapacities: ["Upper Push Endurance", "Upper Pull Endurance", "Knee-Dominant Endurance", "Hip-Dominant Endurance"]

  - id: "CAP_FORCE_EXPRESSION"
    domain_id: "DOMAIN_STRENGTH"
    name: "Force Expression"
    hierarchy_level: 4
    capacity_type: "Expression"
    parent_capacity_id: "CAP_FORCE_ENDURANCE"
    required_predecessor_id: "CAP_FORCE_ENDURANCE"
