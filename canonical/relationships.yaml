# Suggestion rules (Platform Data §15): when both source and target are below
# Functional, the engine suggests "Causes / Contributes To" for coach review.
suggestion_rules:
  - id: "SUGGEST_HIP_WORKSPACE_LOWER_CHAIN"
    if: { source: "CAP_JOINT_WORKSPACE", source_below: "FUNCTIONAL", target: "CAP_MOBILITY_INTEGRATION", target_below: "FUNCTIONAL" }
    suggest: "CAUSES_OR_CONTRIBUTES_TO"
    verification_status: "VERIFIED"
    source: "HTC PLATFORM DATA §15 example rule 1"
  - id: "SUGGEST_AEROBIC_BASE_RECOVERY"
    if: { source: "CAP_AEROBIC_BASE", source_is: "CRITICAL", target: "CAP_RECOVERY_CAPACITY", target_is: "CRITICAL" }
    suggest: "CONTRIBUTES_TO"
    verification_status: "VERIFIED"
    source: "HTC PLATFORM DATA §15 example rule 2"
  - id: "SUGGEST_STABILITY_LIMITS_FORCE"
    if: { source: "CAP_STABILITY", source_is: "CRITICAL", target: "CAP_FORCE_PRODUCTION", target_is: "EMERGING" }
    suggest: "MAY_LIMIT"
    verification_status: "VERIFIED"
    source: "HTC PLATFORM DATA §15 example rule 3"

