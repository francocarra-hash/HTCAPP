# HTC Standards — raw result → classification.
# Sources: HTC Strength Assessment Standards COMPLETE v2, HTC MASTER TABLES T3,
# HTC Mobility Standard v2, HTC Health Markers Standard.
#
# TECHNICAL CONVENTION (not HTC knowledge): where a source gives touching band
# edges (e.g. "35.0–43.6" then "43.6–55.9"), bands are interpreted as
# lower-bound-inclusive / upper-bound-exclusive for HIGHER_IS_BETTER, and the
# mirror for LOWER_IS_BETTER. Flagged for HTC confirmation.
#
# classification_model.type:
#   HIGHER_IS_BETTER — value >= foundation_min ⇒ FOUNDATION, etc.
#   LOWER_IS_BETTER  — value <= foundation_max ⇒ FOUNDATION, etc.
#   ALGORITHMIC      — deterministic rule set (see rules[]), not numeric bands.
#
# population: null field = source does not restrict it. A standard with
# verification_status PLACEHOLDER must make the engine FAIL LOUDLY if selected.

