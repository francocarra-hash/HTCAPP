    test_id: "TEST_HANDGRIP"
    population: { sex: "MALE", age_min: 30, age_max: 34, activity_level: null }
    classification_model:
      type: "HIGHER_IS_BETTER"
      basis: "Percentile bands: Foundation ≥P75, Functional P25-P75, Emerging P5-P25, Critical <P5"
    thresholds: { foundation_min: 55.9, functional_min: 43.6, emerging_min: 35.0 }
    unit: "kg"
    standard_type: "Normative"
    evidence:
      based_on: ["REF_IGRIPS_2024", "REF_LEONG_2023"]
      sample_size: 2400000
      data_source: "iGRIPS 2024 (≈2.4M measurements, 69 countries)"
    version: "2.0"
    verification_status: "VERIFIED"
    source: "HTC_Strength_Assessment_Standards §1 Test 1 — Example Reference Values Age 30-34 (Men)"

