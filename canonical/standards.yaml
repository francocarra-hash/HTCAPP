  # ── MOBILITY — regional screen algorithm (domain-level) ────────────────────
  - id: "STANDARD_MOBILITY_REGIONAL_SCREEN"
    test_id: "TEST_MOBILITY_REGIONAL_SCREEN"
    population: null
    classification_model:
      type: "ALGORITHMIC"
      basis: "Deterministic rules over 4 regional interpretations (CLEAR/LIMITED/ASYMMETRICAL/PAINFUL/NEEDS_DEEPER)"
      rules:
        - id: "MOB_RULE_1_PAINFUL"
          if: "any region == PAINFUL"
          then: { classification_at_most: "EMERGING", red_flag: true, deep_dive: true }
        - id: "MOB_RULE_2_CRITICAL_REGION"
          if: "any region == CRITICAL_BLOCKING"
          then: { classification: "CRITICAL", deep_dive: true }
        - id: "MOB_RULE_3_MULTIPLE_LIMITED"
          if: "count(region in [LIMITED, ASYMMETRICAL]) >= 2"
          then: { classification: "EMERGING", deep_dive: true }
        - id: "MOB_RULE_4_SINGLE_LIMITED"
          if: "count(region == LIMITED) == 1 and not blocks_goal"
          then: { classification: "FUNCTIONAL", deep_dive: false }
        - id: "MOB_RULE_6_ALL_CLEAR"
          if: "all regions == CLEAR"
          then: { classification: "FOUNDATION" }
    unit: "region_interpretation"
    standard_type: "HTC_Operational"
    evidence: { based_on: ["REF_HTC_OPERATIONAL"] }
    version: "2.0"
    verification_status: "VERIFIED"
    source: "HTC_Mobility_Standard §3-4 (ALGORITHM, deterministic)"
    notes: >
      Source Rule 5 (asymmetry >20% ⇒ flag + selective deep dive) is a flag,
      not a classification change — engine emits FLAG_ASYMMETRY. Source Rule 6
      allows FOUNDATION or FUNCTIONAL when all CLEAR; numeric sub-banding
      (§3: F 80-100 / Fn 60-79) requires a scored input the screen does not
      define — all-CLEAR maps to FOUNDATION; HTC to confirm.

